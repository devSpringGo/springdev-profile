<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tiêu đề, mô tả, thẻ chia sẻ (Open Graph)...: do vite-plugin-blog.ts chèn vào, sửa nội dung ở lib/blog.ts → SITE -->
    <!--seo-->
    <script>
      // Áp dụng theme đã lưu trước khi trang hiển thị để tránh nháy màu
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              paper: 'rgb(var(--paper) / <alpha-value>)',
              surface: 'rgb(var(--surface) / <alpha-value>)',
              raised: 'rgb(var(--raised) / <alpha-value>)',
              ink: 'rgb(var(--ink) / <alpha-value>)',
              muted: 'rgb(var(--muted) / <alpha-value>)',
              line: 'rgb(var(--line) / <alpha-value>)',
              accent: 'rgb(var(--accent) / <alpha-value>)',
              primary: 'rgb(var(--accent) / <alpha-value>)',
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --paper: 249 250 251;
        --surface: 255 255 255;
        --raised: 241 243 246;
        --ink: 17 24 39;
        --muted: 95 104 118;
        --line: 228 231 236;
        --accent: 29 78 216;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: 11 14 19;
          --surface: 17 21 28;
          --raised: 25 30 39;
          --ink: 233 236 241;
          --muted: 148 157 171;
          --line: 36 42 53;
          --accent: 120 164 255;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --paper: 11 14 19;
        --surface: 17 21 28;
        --raised: 25 30 39;
        --ink: 233 236 241;
        --muted: 148 157 171;
        --line: 36 42 53;
        --accent: 120 164 255;
        color-scheme: dark;
      }

      /* Màu tranh phong cảnh nền — sáng: bình minh */
      :root {
        --sky-top: 214 228 246;
        --sky-mid: 236 238 247;
        --sky-horizon: 253 232 214;
        --sun: 255 238 218;
        --sun-glow: 255 196 150;
        --mtn-far: 208 216 234;
        --mtn-mid: 188 200 224;
        --mtn-near: 168 184 213;
        --mist: 250 238 230;
        --sea-top: 224 230 243;
        --sea-bottom: 198 211 233;
        --shimmer: 255 255 255;
        --star: 255 255 255;
        --star-opacity: 0;
      }
      /* Tối: đêm trăng */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --sky-top: 7 10 20;
          --sky-mid: 14 20 38;
          --sky-horizon: 30 38 68;
          --sun: 232 237 248;
          --sun-glow: 140 168 228;
          --mtn-far: 30 39 66;
          --mtn-mid: 21 28 49;
          --mtn-near: 12 16 29;
          --mist: 42 52 86;
          --sea-top: 22 30 54;
          --sea-bottom: 10 14 26;
          --shimmer: 190 205 240;
          --star: 255 255 255;
          --star-opacity: 1;
        }
      }
      :root[data-theme="dark"] {
        --sky-top: 7 10 20;
        --sky-mid: 14 20 38;
        --sky-horizon: 30 38 68;
        --sun: 232 237 248;
        --sun-glow: 140 168 228;
        --mtn-far: 30 39 66;
        --mtn-mid: 21 28 49;
        --mtn-near: 12 16 29;
        --mist: 42 52 86;
        --sea-top: 22 30 54;
        --sea-bottom: 10 14 26;
        --shimmer: 190 205 240;
        --star: 255 255 255;
        --star-opacity: 1;
      }
      html, body {
        background-color: rgb(var(--paper));
        color: rgb(var(--ink));
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html { scroll-behavior: smooth; }
      ::selection { background: rgb(var(--accent) / 0.18); }

      .field {
        width: 100%;
        background: rgb(var(--paper));
        border: 1px solid rgb(var(--line));
        border-radius: 8px;
        padding: 0.625rem 0.875rem;
        color: rgb(var(--ink));
        font-size: 0.9375rem;
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }
      .field::placeholder { color: rgb(var(--muted) / 0.7); }
      .field:focus { border-color: rgb(var(--accent)); box-shadow: 0 0 0 3px rgb(var(--accent) / 0.15); }

      /* Khi có ảnh nền: quầng sáng nhẹ quanh chữ để tách chữ khỏi ảnh */
      .on-photo {
        text-shadow:
          0 0 1px rgb(var(--paper) / 0.9),
          0 0 6px rgb(var(--paper) / 0.85),
          0 0 16px rgb(var(--paper) / 0.7);
      }
      .on-photo pre, .on-photo code, .on-photo input, .on-photo textarea, .on-photo button,
      .on-photo [class*="bg-ink"], .on-photo [class*="bg-surface"], .on-photo [class*="bg-accent"],
      .on-photo [class*="bg-raised"], .on-photo [class*="bg-emerald"] { text-shadow: none; }
      /* Chữ phụ đậm hơn một chút khi nằm trên ảnh */
      .on-photo { --muted: 68 76 90; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .on-photo { --muted: 184 191 203; }
      }
      :root[data-theme="dark"] .on-photo { --muted: 184 191 203; }

      /* Tô màu code trong bài viết (highlight.js) — sáng: kiểu GitHub */
      :root {
        --hl-keyword: 207 34 46;
        --hl-string: 10 48 105;
        --hl-number: 5 80 174;
        --hl-comment: 110 119 129;
        --hl-title: 130 80 223;
        --hl-type: 149 56 0;
        --hl-tag: 17 99 41;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --hl-keyword: 255 123 114;
          --hl-string: 165 214 255;
          --hl-number: 121 192 255;
          --hl-comment: 139 148 158;
          --hl-title: 210 168 255;
          --hl-type: 255 166 87;
          --hl-tag: 126 231 135;
        }
      }
      :root[data-theme="dark"] {
        --hl-keyword: 255 123 114;
        --hl-string: 165 214 255;
        --hl-number: 121 192 255;
        --hl-comment: 139 148 158;
        --hl-title: 210 168 255;
        --hl-type: 255 166 87;
        --hl-tag: 126 231 135;
      }
      .hljs-keyword, .hljs-doctag, .hljs-template-tag, .hljs-selector-tag, .hljs-meta .hljs-keyword { color: rgb(var(--hl-keyword)); }
      .hljs-string, .hljs-regexp, .hljs-meta .hljs-string, .hljs-char.escape_ { color: rgb(var(--hl-string)); }
      .hljs-number, .hljs-literal, .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable,
      .hljs-meta, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id, .hljs-symbol, .hljs-operator { color: rgb(var(--hl-number)); }
      .hljs-comment, .hljs-quote { color: rgb(var(--hl-comment)); font-style: italic; }
      .hljs-title, .hljs-title.function_, .hljs-section { color: rgb(var(--hl-title)); }
      .hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-params .hljs-type, .hljs-variable.language_ { color: rgb(var(--hl-type)); }
      .hljs-name, .hljs-tag .hljs-name, .hljs-bullet, .hljs-addition { color: rgb(var(--hl-tag)); }
      .hljs-deletion { color: rgb(var(--hl-keyword)); }
      .hljs-strong { font-weight: 600; }
      .hljs-emphasis { font-style: italic; }

      /* Nội dung bài có sẵn trong file HTML (cho Google / khi chưa chạy JavaScript) */
      .prerendered { font-size: 1.0625rem; line-height: 1.8; color: rgb(var(--ink) / 0.8); }
      .prerendered > * + * { margin-top: 1.25rem; }
      .prerendered h2 { font-size: 1.5rem; font-weight: 700; color: rgb(var(--ink)); padding-top: 1.5rem; }
      .prerendered h3 { font-size: 1.125rem; font-weight: 600; color: rgb(var(--ink)); padding-top: 0.5rem; }
      .prerendered ul { list-style: disc; padding-left: 1.25rem; }
      .prerendered ol { list-style: decimal; padding-left: 1.25rem; }
      .prerendered pre { overflow-x: auto; padding: 1rem; border: 1px solid rgb(var(--line)); border-radius: 0.75rem; background: rgb(var(--raised)); font-size: 13px; }
      .prerendered code { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .prerendered blockquote { border-left: 2px solid rgb(var(--accent)); padding-left: 1.25rem; font-style: italic; }
      .prerendered a { color: rgb(var(--accent)); text-decoration: underline; }
      .prerendered img { max-width: 100%; border-radius: 0.75rem; }
      .prerendered table { width: 100%; border-collapse: collapse; }
      .prerendered th, .prerendered td { border: 1px solid rgb(var(--line)); padding: 0.5rem 0.75rem; text-align: left; }

      :focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; border-radius: 4px; }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
